[package]
name = "gpt-image-playground"
version = "1.0.1"
description = "GPT Image 本地便携版桌面端"
authors = ["wg1929"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 让 Tauri 的命令与 setup 集中在 lib.rs 中，便于桌面壳与移动端复用
name = "gpt_image_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
